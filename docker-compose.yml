services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-192.168.159.22}
      DB_PORT: ${DB_PORT:-33307}
      DB_USER: ${DB_USER:-app_cdp}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-app_cdp}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      DEDUP_TEST_MODE_MAX_COMPANIES: ${DEDUP_TEST_MODE_MAX_COMPANIES:-0}
      TZ: Asia/Shanghai
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ruijie_cdp

  nginx:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${NGINX_PORT:-28080}:80"
    networks:
      - ruijie_cdp

networks:
  ruijie_cdp:
    driver: bridge
