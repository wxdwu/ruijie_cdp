services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    # 后端配置统一从 backend/.env 读取（ES / LLM / Embedding 等），
    # 不再依赖项目根目录 .env。
    env_file:
      - backend/.env
    environment:
      DB_HOST: ${DB_HOST:-192.168.159.22}
      DB_PORT: ${DB_PORT:-33307}
      DB_USER: ${DB_USER:-app_cdp}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-app_cdp}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ruijie_cdp

  nginx:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${NGINX_PORT:-28080}:80"
    networks:
      - ruijie_cdp

networks:
  ruijie_cdp:
    driver: bridge
