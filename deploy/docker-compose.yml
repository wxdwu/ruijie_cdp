# 说明：使用 host 网络模式（network_mode: host），容器直接共享宿主机网络栈，
# 不再创建任何 CNI/bridge 自定义网络，从根本上规避 podman 3.x 的
# "CNI network not found" 问题，也无需安装 netavark 或升级 podman。
# 前提：宿主机上 3306（MySQL）、8000（后端）、28080（nginx）端口未被占用。
#
# 数据库改为「本机 docker MySQL」：
#   - mysql 服务首次启动（数据卷为空）时，自动按文件名顺序执行 initdb 脚本：
#       00_init_user.sql        创建 app_cdp 账号并授予全库权限
#       01_init_table_struc.sql 建库 + 表结构（含索引）
#       02_init_table_data.sql  导入初始化数据
#   - backend 通过 config.py 默认值（127.0.0.1:3306 / app_cdp / 123456 / app_cdp）
#     直连本机 MySQL，部署时不再依赖 backend/.env。
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    # 与源库（8.4）一致，统一 utf8mb4，避免中文乱码
    # --mysql-native-password=ON：8.4 默认禁用该插件，而 PyMySQL 未安装 cryptography，
    # 必须用 mysql_native_password 认证，故需显式启用（否则 CREATE USER ... mysql_native_password 报错）。
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--mysql-native-password=ON"
    network_mode: host
    volumes:
      - mysql_data:/var/lib/mysql
      # initdb 脚本（仅在数据卷为空的首次初始化时执行，按文件名字典序）：
      #   00_init_user.sql        创建 app_cdp 账号并授予全库权限（位于 sql_init/）
      #   01_init_table_struc.sql 建库 + 表结构（含索引）
      #   02_init_table_data.sql  导入初始化数据
      - ./sql_init/00_init_user.sql:/docker-entrypoint-initdb.d/00_init_user.sql:ro
      - ./sql_init/01_init_table_struc.sql:/docker-entrypoint-initdb.d/01_init_table_struc.sql:ro
      - ./sql_init/02_init_table_data.sql:/docker-entrypoint-initdb.d/02_init_table_data.sql:ro
    healthcheck:
      # 1) initdb 期间临时服务仅监听 socket（TCP 不可用），mysqladmin ping 会失败，
      #    直至 00/01/02 全部执行完毕、正式服务在 3306 上就绪；
      # 2) 进一步确认 app_cdp 库已建好（01 执行完），避免 backend 在“仅 TCP 通但库未建”时启动。
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -P3306 -uroot -p123456 --silent && mysql -h127.0.0.1 -P3306 -uroot -p123456 -e \"SELECT 1 FROM information_schema.schemata WHERE schema_name='app_cdp'\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    # 生产模式：显式注入 APP_ENV=production（覆盖 config.py 的 development 默认值），并加载 backend/.env.production（含 DB / LLM / ES 等）。
    # env_file 会把文件中的键注入为容器环境变量，config.py 通过 os.getenv 读取（进程 env 优先）。
    # 若缺少 backend/.env.production，deploy.sh 会在 up 前用 .env.example 生成并告警。
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
    env_file:
      - ../backend/.env.production
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  nginx:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:28080/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
