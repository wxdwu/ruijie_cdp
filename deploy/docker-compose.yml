# 说明：使用 host 网络模式（network_mode: host），容器直接共享宿主机网络栈，
# 不再创建任何 CNI/bridge 自定义网络，从根本上规避 podman 3.x 的
# "CNI network not found" 问题，也无需安装 netavark 或升级 podman。
# 前提：宿主机上 8000（后端）与 28080（nginx）端口未被占用。
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    # 后端配置统一从 backend/.env 读取（ES / LLM / Embedding 等），
    # 不再依赖项目根目录 .env。
    env_file:
      - ../backend/.env
    environment:
      TZ: Asia/Shanghai
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  nginx:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:28080/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
