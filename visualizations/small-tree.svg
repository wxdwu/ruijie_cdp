<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Transparent background -->
  <g id="small-tree" transform="translate(0,0)">
    <!-- Trunk -->
    <rect x="236" y="320" width="40" height="120" rx="8" fill="#8B5A2B" />

    <!-- Lower canopy -->
    <ellipse cx="256" cy="260" rx="120" ry="72" fill="#2E7D32" />

    <!-- Middle canopy -->
