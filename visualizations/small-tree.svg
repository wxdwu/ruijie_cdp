    <!-- Simple highlight shapes for style -->
    <ellipse cx="220" cy="190" rx="24" ry="16" fill="#A5D6A7" opacity="0.35" />
    <ellipse cx="300" cy="230" rx="18" ry="12" fill="#A5D6A7" opacity="0.28" />
  </g>
</svg>
